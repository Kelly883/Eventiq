<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>EventIQ</title>
    <!-- Inter (with system-ui fallback) gives the editorial typography
         defined in DESIGN_SYSTEM.md actual weight on the page; without it
         the hero reads as default-sans, which feels generic. Preconnect +
         display=swap keeps the request non-blocking and the text visible
         during the load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
  </head>

  </body>
