user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "request" '
                    '$status $body_bytes_sent "http_referer" '
                    '"http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream php-fpm {
        server 127.0.0.1:9000;
    }

    server {
        # Render injects PORT at runtime via environment variable.
        # Nginx doesn't natively support env interpolation in listen directive,
        # so we use the entrypoint to generate the correct config before starting.
        listen 80;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;
        client_max_body_size 32M;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location ~ /\.(env|git|gitignore|dockerignore|htaccess|nginx.conf|Dockerfile) {
            deny all;
            return 404;
        }

        location ~ ^/(config|database|resources|vendor|node_modules)/ {
            deny all;
            return 404;
        }

        location ~ ^/(composer\.json|composer\.lock) {
            deny all;
            return 404;
        }

        location ~ ^/storage/(?!public/) {
            deny all;
            return 404;
        }

        location = /health {
            try_files /index.php =404;
            fastcgi_pass php-fpm;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php$request_uri;
            fastcgi_param HTTPS off;
        }

        location = /up {
            try_files /index.php =404;
            fastcgi_pass php-fpm;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php$request_uri;
            fastcgi_param HTTPS off;
        }

        location ~ \.php$ {
            fastcgi_pass php-fpm;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTPS off;
            fastcgi_read_timeout 300;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
