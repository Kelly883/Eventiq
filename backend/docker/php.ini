# PHP production settings for EventIQ Laravel backend
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 32M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000

# Disable dangerous functions in production
# Note: proc_open is NOT disabled because MjmlRenderer uses Laravel's
# Process facade (which relies on proc_open) to shell out to Node.js for MJML.
disable_functions = exec,passthru,shell_exec,system,popen,parse_ini_file,show_source

# Security
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log

# Session
session.gc_maxlifetime = 3600
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1

# Opcache for production
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
